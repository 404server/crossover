server.port=8080
spring.main.banner-mode=off
logging.level.root=warn
logging.level.org.springframework.boot.web.embedded=info
# Spring Boot default: 200 platform worker threads per process. Bounded concurrency is the admission
# control; unbounded virtual threads let overload queue up in the heap until the pod is OOM-killed.
server.tomcat.threads.max=200
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crossover}
spring.datasource.username=${DB_USER:crossover}
spring.datasource.password=${DB_PASSWORD:crossover}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}
# Wait for the database at startup (pods start concurrently in Kubernetes).
spring.datasource.hikari.initialization-fail-timeout=180000
# Never close keep-alive connections from the server side while clients may reuse them:
# the JDK client does not retry non-idempotent POSTs that race with a server-side close.
server.tomcat.max-keep-alive-requests=-1
server.tomcat.keep-alive-timeout=75s
# Bound accepted connections per process (default 8192). Under open-loop overload the load
# generator holds one connection per in-flight request; unbounded, their socket and NIO buffers
# exceed a small pod's memory limit and the kernel OOM-kills it. Excess waits in the OS backlog.
server.tomcat.max-connections=1000
